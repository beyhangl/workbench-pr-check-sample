# Offline draft only. Publish after owner review and approved execution scope.
# pull_request evaluates the PR workflow definition. Only trusted owner-created heads
# are permitted; independently compare their workflow with this reviewed source before opening.
# No explicit PR checkout, downloaded PR executable, model deployment, or AWS credentials.
# Never synchronize, reopen, or rerun to resubmit. Reconcile uncertain outcomes read-only outside this workflow.
name: Reference prompt evaluation
on:
  pull_request:
    branches: [develop]
    types: [opened]
permissions: {}
concurrency:
  group: reference-evaluation-${{ github.repository_id }}-${{ github.event.pull_request.number }}-${{ vars.AQ_CHECK_KEY }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop' && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'opened' && github.event.pull_request.user.login == github.repository_owner && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.run_attempt == 1 && (github.event.pull_request.head.ref == 'sample/pass' || github.event.pull_request.head.ref == 'sample/regression')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Load protected evaluation binding
        shell: bash
        env:
          AQ_SAMPLE_BINDING: ${{ secrets.AQ_SAMPLE_BINDING }}
        run: |
          python3 -I - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          try:
              binding = json.loads(os.environ['AQ_SAMPLE_BINDING'])
              fields = ('AQ_ENDPOINT', 'AQ_UI_URL', 'AQ_API_KEY')
              if not isinstance(binding, dict) or set(binding) != set(fields):
                  raise ValueError
              values = {key: binding[key] for key in fields}
              if any(not isinstance(value, str) or not value.strip()
                     or any(ord(char) < 32 or ord(char) == 127 for char in value)
                     for value in values.values()):
                  raise ValueError
              masks = set(values.values())
              for key in ('AQ_ENDPOINT', 'AQ_UI_URL'):
                  parts = urlsplit(values[key])
                  if parts.scheme != 'https' or not parts.hostname or parts.username or parts.password or parts.query or parts.fragment:
                      raise ValueError
                  masks.add(parts.hostname)
              def command_escape(value):
                  return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              # Register every derived address/key component before writing step environment.
              for value in sorted(masks):
                  print('::add-mask::' + command_escape(value), flush=True)
              with Path(os.environ['GITHUB_ENV']).open('a') as output:
                  for key, value in values.items():
                      output.write('AQ_SAMPLE_' + key.removeprefix('AQ_') + '=' + value + '\n')
          except Exception:
              raise SystemExit('Protected evaluation binding is unavailable or invalid. No evaluation started.') from None
          PYTHON
      - id: prompts
        name: Read immutable prompt data
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I - <<'PYTHON'
          import base64
          import hashlib
          import http.client
          import html
          import json
          import os
          from pathlib import Path
          import re
          import tempfile
          from urllib.parse import quote

          try:
              repository = os.environ['SOURCE_REPOSITORY']
              if not re.fullmatch(r'[A-Za-z0-9-]+/[A-Za-z0-9_.-]+', repository):
                  raise ValueError
              prefix = '/repos/' + repository + '/git/'
              source_path = 'prompts/reference-system.txt'
              maximum = 256 * 1024
              def read_object(kind, identity):
                  if not re.fullmatch(r'[0-9a-f]{40}', identity):
                      raise ValueError
                  path = prefix + kind + '/' + identity
                  connection = http.client.HTTPSConnection('api.github.com', timeout=20)
                  try:
                      connection.request('GET', path, headers={
                          'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                          'Accept': 'application/vnd.github+json',
                          'X-GitHub-Api-Version': '2022-11-28',
                          'User-Agent': 'reference-prompt-source'})
                      response = connection.getresponse()
                      body = response.read(1024 * 1024 + 1)
                      if response.status != 200 or len(body) > 1024 * 1024:
                          raise ValueError
                      value = json.loads(body)
                      if not isinstance(value, dict) or value.get('sha') != identity or value.get('url') != 'https://api.github.com' + path:
                          raise ValueError
                      return value
                  finally:
                      connection.close()
              directory = Path(tempfile.mkdtemp(prefix='reference-prompts-', dir=os.environ['RUNNER_TEMP']))
              directory.chmod(0o700)
              records = {}
              outputs = {}
              for role, commit in (('base', os.environ['SOURCE_BASE_SHA']), ('candidate', os.environ['SOURCE_HEAD_SHA'])):
                  root = read_object('commits', commit)
                  tree = read_object('trees', root['tree']['sha'])
                  if tree.get('truncated') is not False or not isinstance(tree.get('tree'), list):
                      raise ValueError
                  # Resolve the two fixed path components without following symbolic links.
                  entries = [item for item in tree['tree'] if item.get('path') == 'prompts']
                  if len(entries) != 1 or entries[0].get('type') != 'tree' or entries[0].get('mode') != '040000':
                      raise ValueError
                  prompts = read_object('trees', entries[0]['sha'])
                  if prompts.get('truncated') is not False or not isinstance(prompts.get('tree'), list):
                      raise ValueError
                  entries = [item for item in prompts['tree'] if item.get('path') == 'reference-system.txt']
                  if len(entries) != 1 or entries[0].get('type') != 'blob' or entries[0].get('mode') != '100644':
                      raise ValueError
                  blob = read_object('blobs', entries[0]['sha'])
                  if blob.get('encoding') != 'base64' or not isinstance(blob.get('content'), str):
                      raise ValueError
                  data = base64.b64decode(''.join(blob['content'].split()), validate=True)
                  if (type(blob.get('size')) is not int or len(data) != blob['size'] or len(data) > maximum
                          or hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() != entries[0]['sha']):
                      raise ValueError
                  text = data.decode('utf-8')
                  if not text.strip() or '\r' in text or '\0' in text:
                      raise ValueError
                  # Refuse known credentials before publishing even a prompt digest.
                  for secret in (os.environ['AQ_SAMPLE_API_KEY'], os.environ['GITHUB_TOKEN']):
                      markdown = re.sub(r'([\\`*_{}\[\]<>#|])', r'\\\1', html.escape(secret).replace('@', '&#64;')).replace('\n', ' ')
                      variants = {secret, markdown, html.escape(secret), quote(secret, safe='')}
                      variants.update(json.dumps(value)[1:-1] for value in tuple(variants))
                      if not secret or any(value in text for value in variants):
                          raise ValueError
                  destination = directory / (role + '.txt')
                  descriptor = os.open(destination, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                  with os.fdopen(descriptor, 'wb') as output:
                      output.write(data)
                  records[role] = {'repository': repository, 'path': source_path, 'commit': commit,
                                   'blob_sha1': entries[0]['sha'], 'sha256': hashlib.sha256(data).hexdigest()}
                  outputs[role + '-file'] = str(destination)
              receipt = directory / 'source-binding.json'
              descriptor = os.open(receipt, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(descriptor, 'w', encoding='utf-8') as output:
                  json.dump(records, output, indent=2)
              with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
                  for key, value in outputs.items():
                      if '\n' in value or '\r' in value:
                          raise ValueError
                      output.write(key + '=' + value + '\n')
              with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
                  summary.write('| Prompt | Commit | Git blob SHA1 | Prompt SHA256 | Source path |\n| --- | --- | --- | --- | --- |\n')
                  for role in ('base', 'candidate'):
                      item = records[role]
                      summary.write('| ' + role + ' | `' + item['commit'] + '` | `' + item['blob_sha1'] + '` | `' + item['sha256'] + '` | `prompts/reference-system.txt` |\n')
          except Exception:
              raise SystemExit('Immutable prompt data could not be verified. No evaluation started.') from None
          PYTHON
      - id: evaluation
        uses: beyhangll/workbench-sdk/.github/actions/evaluate@61150d4dfa291f394eb9323dd1e92d86d6ce9ea2
        continue-on-error: true
        with:
          endpoint: ${{ env.AQ_SAMPLE_ENDPOINT }}
          ui-url: ${{ env.AQ_SAMPLE_UI_URL }}
          api-key: ${{ env.AQ_SAMPLE_API_KEY }}
          target: ${{ vars.AQ_AGENT }}
          dataset: ${{ vars.AQ_DATASET }}
          agent-endpoint: DEFAULT
          commit: ${{ github.event.pull_request.head.sha }}
          base-commit: ${{ vars.AQ_BASE_DEPLOYED_COMMIT }}
          base-endpoint: DEFAULT
          system-prompt-file: ${{ steps.prompts.outputs.candidate-file }}
          base-system-prompt-file: ${{ steps.prompts.outputs.base-file }}
          baseline-experiment: ${{ vars.AQ_BASELINE_EXPERIMENT }}
          budget: ${{ vars.AQ_BUDGET_USD }}
          timeout: ${{ vars.AQ_TIMEOUT_SECONDS }}
          github-token: ${{ github.token }}
          publisher-id: ${{ vars.AQ_COMMENT_PUBLISHER_ID }}
          check-app-id: ${{ vars.AQ_CHECK_APP_ID }}
          check-key: ${{ vars.AQ_CHECK_KEY }}
          allow-forks: false
          publish-report-links: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.evaluation.outputs.report-dir != ''
        with:
          name: evaluation-aggregate
          path: |
            ${{ steps.evaluation.outputs.report-dir }}/evaluation.md
            ${{ steps.evaluation.outputs.report-dir }}/aggregate-result.json
            ${{ steps.evaluation.outputs.report-dir }}/publication.json
          retention-days: 7
          if-no-files-found: error
      - name: Preserve evaluation or publication failure
        if: always()
        env:
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
        run: test "$EVALUATION_OUTCOME" = success
